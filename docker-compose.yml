services:
  btop:
    image: btop-plus-plus:latest   # built with ./build.sh (or hbixu/btop-plus-plus:latest from Docker Hub)
    container_name: btop
    pid: host            # Required: see host processes
    network_mode: host   # Required: see host network interfaces (port is opened directly on the host)
    privileged: true     # Access to sensors/temperatures and hardware metrics (/sys, /dev)
    environment:
      # Web interface port (default: 7681)
      - PORT=${BTOP_PORT:-7681}
      # Font size in the browser (default: 16). Increase on large/high-resolution screens
      # - FONT_SIZE=16
    volumes:
      - ./config:/config   # btop configuration (./config/btop/btop.conf)
      - /etc/localtime:/etc/localtime:ro
      # Disks to show in btop (read-only)
      # - /mnt/data:/mnt/data:ro
    restart: unless-stopped
